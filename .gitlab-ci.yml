# GitLab CI/CD for building and pushing Docker images to Nexus
# Registry: 192.168.1.132:8181/new-api

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: 192.168.1.132:8181
  IMAGE_NAME: $REGISTRY/new-api

stages:
  - build
  - manifest

# Build multi-arch images (amd64 + arm64)
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD" $REGISTRY
    - docker buildx create --name multiarch --driver docker-container --use || true
    - docker buildx inspect --bootstrap
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      echo "Building $IMAGE_NAME:$TAG for $ARCH"
      docker buildx build \
        --platform $PLATFORM \
        --push \
        -t $IMAGE_NAME:$TAG-$ARCH \
        -t $IMAGE_NAME:latest-$ARCH \
        .
  parallel:
    matrix:
      - ARCH: amd64
        PLATFORM: linux/amd64
      - ARCH: arm64
        PLATFORM: linux/arm64
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"

# Create multi-arch manifest
manifest:
  stage: manifest
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD" $REGISTRY
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      echo "Creating manifest for $IMAGE_NAME:$TAG"
      docker buildx imagetools create \
        -t $IMAGE_NAME:$TAG \
        $IMAGE_NAME:$TAG-amd64 \
        $IMAGE_NAME:$TAG-arm64
      echo "Creating manifest for $IMAGE_NAME:latest"
      docker buildx imagetools create \
        -t $IMAGE_NAME:latest \
        $IMAGE_NAME:latest-amd64 \
        $IMAGE_NAME:latest-arm64
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "web"
  needs:
    - build